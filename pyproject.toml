[build-system]
requires = ["setuptools>=70", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorkit"
version = "0.1.0"
description = "Signal-processing helpers for sensor data, cythonized for armv8 (aarch64)"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["sensorkit"]
